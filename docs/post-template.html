<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{TITLE}} • Мама я вайбкодер</title>
    <meta name="description" content="{{EXCERPT}}">
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/318/318966.png">
    <link rel="stylesheet" href="../css/style.css?v=20261012-3">
</head>
<body>
    <div class="container">
        <!-- Back Link -->
        <a href="../index.html" class="back-link">← Назад к постам</a>

        <!-- Post Content -->
        <article class="post-content">
            <header class="post-header">
                <h1>{{TITLE}}</h1>
                <div class="post-meta">
                    <span class="post-date">📅 {{DATE}}</span>
                    <span>•</span>
                    <span class="post-reading-time">⏱️ {{READING_TIME}} мин</span>
                </div>
            </header>

            <div class="post-content-body">
                {{CONTENT}}
            </div>
        </article>

        <!-- Footer -->
        <footer class="footer">
            <p>Сделано с ❤️ для вайбкодеров · 2026</p>
        </footer>
    </div>
</body>
</html>
