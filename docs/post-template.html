<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{TITLE}} • Дядя Миша</title>
    <meta name="description" content="{{EXCERPT}}">

    <link rel="stylesheet" href="../css/style.css?v=20261012-3">
  <link rel="icon" href="favicon.ico?v=20261012-4" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=20261012-4">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png?v=20261012-4">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=20261012-4">
</head>
<body>
    <div class="container">
        <!-- Back Link -->
        <a href="../index.html" class="back-link">← Назад к постам</a>

        <!-- Post Content -->
        <article class="post-content">
            <header class="post-header">
                <h1>{{TITLE}}</h1>
                <div class="post-meta">
                    <span class="post-date">📅 {{DATE}}</span>
                    <span>•</span>
                    <span class="post-reading-time">⏱️ {{READING_TIME}} мин</span>
                </div>
            </header>

            <div class="post-content-body">
                {{CONTENT}}
            </div>
        </article>

        <!-- Footer -->
        <footer class="footer">
            <p>Сделано с ❤️ для вайбкодеров · 2026</p>
        </footer>
    </div>
</body>
</html>
