<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Мама я вайбкодер</title>
    <meta name="description" content="Блог про вайбкодинг, автогенерацию контента и AI-инструменты">
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/318/318966.png">
    <link rel="stylesheet" href="css/style.css?v=20261012-3">
    <script src="https://telegram.org/js/telegram-web-app.js" defer></script>
    <script src="js/telegram.js?v=20261012-3" defer></script>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="header-stars" aria-hidden="true">
                <span style="--x:3%;--y:23%;--delay:-1.4s;--duration:4.2s"></span>
                <span style="--x:9%;--y:72%;--delay:-3s;--duration:5.1s"></span>
                <span style="--x:15%;--y:17%;--delay:-.5s;--duration:3.8s"></span>
                <span class="star-spark" style="--x:21%;--y:82%;--delay:-2.3s;--duration:5.5s"></span>
                <span style="--x:27%;--y:10%;--delay:-4s;--duration:4.8s"></span>
                <span style="--x:34%;--y:75%;--delay:-1.1s;--duration:4.1s"></span>
                <span style="--x:42%;--y:18%;--delay:-3.3s;--duration:5.6s"></span>
                <span style="--x:48%;--y:88%;--delay:-2s;--duration:4.7s"></span>
                <span class="star-spark" style="--x:54%;--y:12%;--delay:-.8s;--duration:5.9s"></span>
                <span style="--x:61%;--y:79%;--delay:-4.2s;--duration:4.4s"></span>
                <span style="--x:68%;--y:15%;--delay:-2.7s;--duration:5.2s"></span>
                <span style="--x:74%;--y:88%;--delay:-1.8s;--duration:4.9s"></span>
                <span style="--x:81%;--y:22%;--delay:-3.8s;--duration:5.3s"></span>
                <span class="star-spark" style="--x:87%;--y:76%;--delay:-.3s;--duration:4.6s"></span>
                <span style="--x:94%;--y:13%;--delay:-2.1s;--duration:5.7s"></span>
                <span style="--x:97%;--y:63%;--delay:-4.5s;--duration:4.3s"></span>
            </div>
            <div class="header-content">
                <h1 class="logo">Вайбкодинг · AI · Автоматизация</h1>
            </div>
        </header>

        <!-- Search -->
        <div class="search-container">
            <label class="sr-only" for="searchInput">Поиск по статьям</label>
            <input type="search" id="searchInput" class="search-input" placeholder="Найти статью…" autocomplete="off">
        </div>

        <div class="section-heading"><h2>Статьи</h2><span id="postCount" aria-live="polite"></span></div>

        <!-- Posts Grid -->
        <main class="posts-grid" id="postsGrid">
            <!-- Карточки постов будут генерироваться через JS -->
        </main>

        <!-- Loading -->
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Загружаем посты...</p>
        </div>

        <!-- Empty State -->
        <div class="empty-state" id="emptyState" style="display: none;">
            <p>📝 Пока нет постов. Создай первый!</p>
        </div>

        <!-- Footer -->
        <footer class="footer">
            <p>Сделано с ❤️ для вайбкодеров · 2026</p>
        </footer>
    </div>

    <script src="js/blog.js?v=20261012-2"></script>
</body>
</html>
