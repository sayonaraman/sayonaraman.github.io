<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Мама я вайбкодер</title>
    <meta name="description" content="Блог про вайбкодинг, автогенерацию контента и AI-инструменты">
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/318/318966.png">
    <link rel="stylesheet" href="css/style.css?v=20261012-1">
    <script src="https://telegram.org/js/telegram-web-app.js" defer></script>
    <script src="js/telegram.js" defer></script>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <h1 class="logo">Блог</h1>
                <p class="tagline">Вайбкодинг · AI · Автоматизация</p>
            </div>
        </header>

        <!-- Search -->
        <div class="search-container">
            <label class="sr-only" for="searchInput">Поиск по статьям</label>
            <input type="search" id="searchInput" class="search-input" placeholder="Найти статью…" autocomplete="off">
        </div>

        <div class="section-heading"><h2>Статьи</h2><span id="postCount" aria-live="polite"></span></div>

        <!-- Posts Grid -->
        <main class="posts-grid" id="postsGrid">
            <!-- Карточки постов будут генерироваться через JS -->
        </main>

        <!-- Loading -->
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Загружаем посты...</p>
        </div>

        <!-- Empty State -->
        <div class="empty-state" id="emptyState" style="display: none;">
            <p>📝 Пока нет постов. Создай первый!</p>
        </div>

        <!-- Footer -->
        <footer class="footer">
            <p>Сделано с ❤️ для вайбкодеров · 2026</p>
        </footer>
    </div>

    <script src="js/blog.js"></script>
</body>
</html>
